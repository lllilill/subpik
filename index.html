<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUBPIK</title>

    <!-- 툴바 버튼에 쓰는 외부 아이콘 폰트입니다. -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- 자막 미리보기에 사용할 글꼴을 Google Fonts에서 불러옵니다. -->
    <link
      href="https://fonts.googleapis.com/css2?
      family=Nanum+Gothic:wght@700;900
      &family=Source+Han+Serif+SC:wght@900
      &family=Noto+Sans+Devanagari:wght@400;700
      &display=swap"
      rel="stylesheet"
    />

    <!-- Pickr는 강조 자막 색상을 고르는 색상 선택기입니다. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.8.2/dist/themes/classic.min.css"
    />
    <!-- 왼쪽 메뉴 상단의 기존 SUBPIK 애니메이션 로고입니다. -->
    <script
      type="module"
      src="https://unpkg.com/@lottiefiles/dotlottie-wc@latest/dist/dotlottie-wc.js"
    ></script>
    <!-- 레이아웃, 컨트롤, 애니메이션 상태를 담당하는 로컬 스타일시트입니다. -->
    <link rel="stylesheet" href="styles.css?v=20260621-9" />

  </head>
  <body>
    <!-- 왼쪽 툴바입니다. 미디어나 자막이 준비되면 버튼이 활성화됩니다. -->
    <div id="leftBar">
      <dotlottie-wc
        class="app-logo"
        src="https://tistory1.daumcdn.net/tistory/7307299/skin/images/logo2.lottie"
        autoplay
        loop
        aria-hidden="true"
      ></dotlottie-wc>

      <button id="fullscreen-btn" aria-label="화면" disabled>
        <svg class="leftbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 10V5h5M14 5h5v5M19 14v5h-5M10 19H5v-5" />
        </svg>
        <span class="leftbar-label">화면</span>
      </button>

      <button id="caption-btn" aria-label="자막" disabled>
        <svg class="leftbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M10 10H8.5a2 2 0 0 0 0 4H10M17 10h-1.5a2 2 0 0 0 0 4H17" />
        </svg>
        <span class="leftbar-label">자막</span>
      </button>

      <button id="copy-btn" aria-label="타이밍" disabled>
        <svg class="leftbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="13" r="7" />
          <path d="M9 3h6M12 6V3M12 10v4l3 2" />
        </svg>
        <span class="leftbar-label">타이밍</span>
      </button>

      <button id="download-btn" aria-label="내보내기" disabled>
        <svg class="leftbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4v10M8 11l4 4 4-4M5 19h14" />
        </svg>
        <span class="leftbar-label">내보내기</span>
      </button>
    </div>

    <!-- 긴 자막 입력 폼에서 위치를 빠르게 찾기 위한 스크롤 북마크 영역입니다. -->
    <aside id="sidebar">
      <div id="handle"></div>
      <div id="container"></div>
    </aside>

    <!-- 모달 형태의 상호작용에서 공통으로 쓰는 배경 레이어입니다. -->
    <div id="modalBackdrop" class="modal-backdrop hidden"></div>

    <!-- 미디어 패널입니다. 영상/오디오 로드, 자막 오버레이, 타임라인, 파형을 담습니다. -->
    <div class="video-panel">
      <div id="player-container">
        <!-- 이 영역을 클릭해 미디어 파일을 고르거나 파일을 끌어다 놓습니다. -->
        <div id="video-container">
          <video id="video" preload="metadata"></video>
          <div id="video-placeholder">
            <div class="media-upload-content">
              <span class="media-upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M6 3h8l4 4v14H6zM14 3v5h5M12 17V10M9 13l3-3 3 3" />
                </svg>
              </span>
              <strong>미디어 파일 추가</strong>
              <span class="media-upload-description">파일을 클릭해서 선택하세요</span>
              <span class="media-select-button">파일 선택</span>
            </div>
          </div>

          <!-- 재생 중 SAMI 자막 미리보기 텍스트가 이곳에 삽입됩니다. -->
          <div id="samiOverlay"></div>

          <!-- 현재 재생 시간입니다. 다른 시간 입력칸으로 끌어다 놓을 수도 있습니다. -->
          <input
            id="time-display"
            class="hidden"
            type="text"
            pattern="[0-9.:,;]*"
            disabled
            value="00:00.000"
            draggable="true"
          />
        </div>

        <!-- 전체 재생 구간을 보여주는 얇은 타임라인과 줌 구간 표시입니다. -->
        <div
          id="timelineContainer"
          style="position: relative; width: 100%; height: 28px"
        >
          <canvas id="timelineCanvas"></canvas>
          <div id="playhead"></div>
          <div id="zoomHighlight"></div>
        </div>

        <!-- 정밀 탐색과 줌을 위한 오디오 파형 영역입니다. -->
        <div id="waveformContainer">
          <canvas id="waveformCanvas"></canvas>
          <div id="waveformPlayhead"></div>
        </div>
      </div>
      <!-- 미디어 패널을 클릭했을 때 열리는 숨겨진 파일 선택기입니다. -->
      <input
        type="file"
        id="fileInput"
        accept="video/*,audio/*"
        style="display: none"
      />
    </div>
    <!-- 미디어 재생 영역과 자막 편집 영역 사이의 드래그 가능한 분할선입니다. -->
    <div id="divider">
      <span class="divider-hover-line" aria-hidden="true"></span>
    </div>

    <svg
      class="divider-valley-shape"
      viewBox="0 0 72 96"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
    >
      <circle class="divider-valley-circle" cx="36" cy="48" r="30" />
      <path
        class="divider-valley-arc"
        d="M26 19.716A30 30 0 0 0 26 76.284"
      />
      <path
        class="divider-valley-arc"
        d="M46 19.716A30 30 0 0 1 46 76.284"
      />
    </svg>

    <!-- 커스텀 애니메이션 아이콘을 가진 생성/출력 전환 버튼입니다. -->
    <div
      class="click-anim-container"
      data-state="0"
      role="button"
      tabindex="0"
      aria-label="자막 생성 및 출력 전환"
      aria-controls="invalidInputPopup"
      aria-expanded="false"
    >
      <div class="click-anim-inner" aria-hidden="true">
        <div class="arrow"></div>
        <div class="dash"></div>
        <div class="arrow arrow-right"></div>
      </div>
    </div>

    <!-- 자막 편집 영역입니다. 언어별 섹션은 script.js에서 동적으로 생성됩니다. -->
    <div class="main-content">
      <div class="container">
        <!-- 활성 언어 버튼이 배치되는 곳입니다. 더하기 버튼은 언어 선택창을 엽니다. -->
        <div class="language-toggle">
          <button id="addLanguageButton" class="lang-add-btn icon">
            <div class="bar vertical"></div>
            <div class="bar horizontal left"></div>
            <div class="bar horizontal right"></div>
          </button>

          <!-- 언어 선택 모달입니다. 스크롤 목록은 script.js가 채웁니다. -->
          <div id="languageModal" class="lang-modal hidden">
            <div class="lang-modal-content">
              <div class="lang-modal-scroll"></div>
            </div>
          </div>
        </div>

        <!-- SAMI 제목과 기본 다운로드 파일명으로 쓰는 제목 입력칸입니다. -->
        <div id="titleInput">
          <input type="text" id="titleText" placeholder="Title" />
        </div>

        <!-- 시작 시 언어별 자막 입력 컨테이너가 이곳에 삽입됩니다. -->
        <div id="sectionContainers"></div>

        <!-- 다운로드 전에 생성된 SAMI 텍스트가 이곳에 표시됩니다. -->
        <textarea id="output"></textarea>
      </div>
    </div>

    <!-- 보이지 않는 Pickr 기준 요소입니다. 색상 선택기 라이브러리가 이 요소에 연결됩니다. -->
    <button id="color-btn" style="display: none"></button>

    <!-- 필수 자막 입력값이 비었거나 형식이 틀렸을 때 표시되는 검증 팝업입니다. -->
    <div
      id="invalidInputOverlay"
      class="center-popup-overlay hidden"
      aria-hidden="true"
    ></div>
    <div
      id="invalidInputPopup"
      class="center-popup hidden"
      role="dialog"
      aria-labelledby="invalidInputTitle"
      aria-describedby="invalidInputSummary"
      data-placement="right"
    >
      <header class="invalid-popup-header">
        <span class="invalid-popup-warning" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 8v5M12 17h.01" />
            <path d="M10.3 4.8 3.2 17.1A2 2 0 0 0 4.9 20h14.2a2 2 0 0 0 1.7-2.9L13.7 4.8a2 2 0 0 0-3.4 0Z" />
          </svg>
        </span>
        <div class="invalid-popup-heading">
          <h2 id="invalidInputTitle">입력 오류</h2>
          <p id="invalidInputSummary">입력 항목을 확인해 주세요</p>
        </div>
      </header>

      <div class="center-popup-content">
        <ul id="invalidInputList" aria-label="오류 항목"></ul>
      </div>
    </div>
    <!-- 앱의 주요 동작을 담당하는 스크립트입니다. -->
    <script src="script.js?v=20260621-21"></script>
  </body>
</html>
